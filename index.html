        document.body.removeChild(textArea);
    };

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(fullText).then(showSuccessMessage).catch(fallbackCopy);
    } else {
        fallbackCopy();
    }
}

function populateSelect(id, start, end, suffix, placeholder) { const select = document.getElementById(id); select.innerHTML = ''; if (placeholder) { const ph_option = document.createElement('option'); ph_option.value = ""; ph_option.textContent = placeholder; ph_option.disabled = true; ph_option.selected = true; select.appendChild(ph_option); } for (let i = start; i <= end; i++) { const option = document.createElement('option'); option.value = i; option.textContent = i + suffix; select.appendChild(option); } }
const tabs = document.querySelectorAll('.tab-button'), contents = document.querySelectorAll('.tab-content');
function showTab(tabName) { contents.forEach(c=>c.classList.remove('active')); tabs.forEach(t=>t.classList.remove('active')); document.getElementById(tabName).classList.add('active'); document.querySelector(`button[onclick="showTab('${tabName}')"]`).classList.add('active'); document.getElementById('result').style.display='none'; document.getElementById('result').style.opacity='0'; }
window.onload = () => { ['', '1', '2'].forEach(suffix => { populateSelect('month' + suffix, 1, 12, '월', '출생월'); populateSelect('day' + suffix, 1, 31, '일', '출생일'); if(suffix === '') populateSelect('hour', 0, 23, '시', '출생시'); }); };
    </script>
</body>
