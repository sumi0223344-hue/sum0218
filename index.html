<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>섬마을 수석원</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1>섬마을 수석원</h1>
            <nav>
                <ul>
                    <li><a href="#" id="menu-intro">소개</a></li>
                    <li><a href="#" id="menu-location">찾아오시는길</a></li>
                    <li><a href="#" id="menu-gallery">갤러리</a></li>
                </ul>
            </nav>
            <div id="login-section">
                <input type="email" id="email" placeholder="이메일">
                <input type="password" id="password" placeholder="비밀번호">
                <button id="login-btn">로그인</button>
                <button id="logout-btn" style="display:none;">로그아웃</button>
            </div>
        </aside>
        <main class="content">
            <section id="intro">
                <h2>소개</h2>
                <p>섬마을 수석원입니다.</p>
                <p>모든 수석 판매합니다.</p>
                <p>문자남겨주세요.</p>
                <p>010-2895-6310</p>
            </section>
            <section id="location" style="display:none;">
                <h2>찾아오시는길</h2>
                <p>섬마을수석원입니다.</p>
            </section>
            <section id="gallery" style="display:none;">
                <h2>갤러리</h2>
                <button id="upload-btn" style="display:none;">등록</button>
                <div id="gallery-list"></div>
                <div id="upload-modal" style="display:none;">
                    <h3>사진 업로드</h3>
                    <input type="file" id="image-upload">
                    <textarea id="image-desc" placeholder="설명"></textarea>
                    <button id="save-btn">저장</button>
                    <button id="cancel-btn">취소</button>
                </div>
            </section>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
